name: Operquay-Rust Security & Supply-Chain CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-gates:
    name: Rust Format, Clippy Pedantic & Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Verify Zero Unbounded Channels
        run: |
          if grep -rn "unbounded_channel" crates/; then
            echo "ERROR: mpsc::unbounded_channel is forbidden by RULES.md"
            exit 1
          fi

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Pedantic Gate (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Test Suite
        run: cargo test --workspace --locked

  frontend-gates:
    name: Frontend Typecheck, Lint, Test & Wasm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build operquay-term-wasm
        run: |
          cargo build --release --target wasm32-unknown-unknown -p operquay-term-wasm
          mkdir -p frontend/public
          cp target/wasm32-unknown-unknown/release/operquay_term_wasm.wasm frontend/public/operquay_term.wasm

      - name: Frontend Typecheck, Audit, Lint, Test & Build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm run build
          test -f dist/operquay_term.wasm

  supply-chain-audit:
    name: Advisories, Licenses, & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit & cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo-audit (RUSTSEC)
        run: cargo audit --deny warnings

      - name: Run cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny check advisories licenses bans sources

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  vulnerability-scan:
    name: Vulnerability & IaC Scanning (Trivy + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Repo Vulnerability & Secret Scan (Table Summary)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          skip-dirs: 'target,frontend/node_modules,frontend/dist,archive,.git'
          format: 'table'
          exit-code: '0'

      - name: Trivy Repo Vulnerability & Secret Gate (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          skip-dirs: 'target,frontend/node_modules,frontend/dist,archive,.git'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy Filesystem SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

      - name: Trivy IaC & Dockerfile Misconfiguration Scan (Table Summary)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'target,frontend/node_modules,frontend/dist,archive,.git'
          format: 'table'
          exit-code: '0'

      - name: Trivy IaC & Dockerfile Misconfiguration Gate (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'target,frontend/node_modules,frontend/dist,archive,.git'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy IaC SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'

      - name: Upload Trivy Repo Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-repo-scan-reports
          path: trivy-*.sarif
          if-no-files-found: ignore

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run govulncheck (terraform-provider-operquay)
        working-directory: terraform-provider-operquay
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker-trivy-scan:
    name: Docker Build & Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build Operquay Production Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: operquay-rust:${{ github.sha }}
          build-args: CARGO_BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Docker Image Scan (Table Summary)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'operquay-rust:${{ github.sha }}'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'

      - name: Trivy Docker Image Vulnerability Gate (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'operquay-rust:${{ github.sha }}'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Docker Image Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker-image'

      - name: Trivy Compose PostgreSQL Image Advisory Scan (Non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'postgres:16-alpine'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-postgres-image.sarif'
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload Compose PostgreSQL SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-postgres-image.sarif') != ''
        with:
          sarif_file: 'trivy-postgres-image.sarif'
          category: 'trivy-compose-postgres'

      - name: Upload Trivy Docker Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-docker-scan-reports
          path: trivy-*.sarif
          if-no-files-found: ignore

  sbom-and-sign:
    name: CycloneDX SBOM & Sigstore Cosign Attestation
    needs: [rust-gates, frontend-gates, supply-chain-audit, vulnerability-scan, docker-trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install CycloneDX & Sigstore Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          mkdir -p artifacts
          find . -maxdepth 3 -path ./artifacts -prune -o -name "*.cdx.json" -type f -exec cp {} artifacts/ \;
          ls -la artifacts/*.cdx.json

      - name: Sign SBOM Bundle with Cosign (OIDC on tagged releases)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf artifacts/operquay-rust-sbom.tar.gz artifacts/*.cdx.json
          cosign sign-blob --yes \
            --output-signature artifacts/operquay-rust-sbom.tar.gz.sig \
            --output-certificate artifacts/operquay-rust-sbom.tar.gz.pem \
            artifacts/operquay-rust-sbom.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: compliance-sbom-artifacts
          path: artifacts/
