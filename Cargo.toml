[workspace]
resolver = "2"
members = [
  "crates/operquay-core",
  "crates/operquay-telemetry",
  "crates/operquay-guac",
  "crates/operquay-display",
  "crates/operquay-rdp",
  "crates/operquay-vnc",
  "crates/operquay-ssm",
  "crates/operquay-recording",
  "crates/operquay-term",
  "crates/operquay-term-wasm",
  "crates/operquay-auth",
  "crates/operquay-aws",
  "crates/operquay-suggest",
  "crates/operquay-llm",
  "crates/operquay-k8s",
  "crates/operquay-db",
  "crates/operquay-forward",
  "crates/operquay-license",
  "crates/operquay-server",
  "crates/operquay-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
base64 = "0.22"
bcrypt = "0.17"
bytes = "1.9"
cipher = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
constant_time_eq = "0.3"
crc32fast = "1.4"
des = "0.8"
ed25519-dalek = "2.1"
flate2 = "1.0"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
http = "1.2"
# Optional FIPS 140-3 mode can swap rustls crypto provider from `ring` to `aws-lc-rs` (`fips` feature)
# when built in a certified FIPS toolchain environment with CMake + Go/NASM available.
ironrdp-cliprdr = "0.9"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-egfx = "0.5"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
ironrdp-tokio = "0.12"
jpeg-encoder = "0.6"
md-5 = "0.10"
mime_guess = "2.0"
num-bigint = "0.4"
sha1 = "0.10"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry-prometheus = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics", "trace"] }
petgraph = "0.7"
png = "0.17"
prometheus = "0.14"
quick-xml = "0.42"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
ring = "0.17"
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
unicode-width = "0.2"
uuid = { version = "1.12", features = ["v4", "serde"] }
webpki-roots = "0.26"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release.package.operquay-server]
opt-level = 1
codegen-units = 1
