# cargo-deny configuration for Operquay-Rust enterprise supply-chain gate (M10.5)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc.18 exact-pinned by sspi/picky via ironrdp-connector 0.12; RDP client is not an RSA decryption oracle" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill 1.0.3 via heapless 0.7.17 (ironrdp-connector -> sspi/scard -> winscard -> iso7816); unused on targets with native atomics" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.1 unmaintained via sspi -> async-dnssd 0.5.1 (macOS/iOS target only)" },
    { id = "RUSTSEC-2026-0574", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0575", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0576", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0577", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0578", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0579", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0580", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0581", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
    { id = "RUSTSEC-2026-0582", reason = "heapless 0.7.17 via ironrdp-connector -> sspi/scard -> winscard 0.4 -> iso7816 0.1; smartcard redirection unused" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "IJG",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
